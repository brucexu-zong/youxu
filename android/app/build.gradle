plugins { id 'com.android.application' }

def vc = (project.findProperty('versionCode') ?: '1') as Integer
def ks = System.getenv('YX_KEYSTORE')

android {
  namespace 'app.youxu.planner'
  compileSdk 34
  defaultConfig {
    applicationId 'app.youxu.planner'
    minSdk 29
    targetSdk 34
    versionCode vc
    versionName '1.0.' + vc
  }
  signingConfigs {
    release {
      if (ks) { storeFile file(ks); storePassword System.getenv('YX_STORE_PASS'); keyAlias 'youxu'; keyPassword System.getenv('YX_KEY_PASS') }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      if (ks) signingConfig signingConfigs.release
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  lint { abortOnError false; checkReleaseBuilds false }
}
