<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F4FD8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="referrer" content="no-referrer">
<title>有序 · 计划管家</title>
<style>
:root {
  /* 设计思路：一页日程纸。纸色底、白色纸面、墨色字，只有一种靛蓝强调色；“现在做”是页面上唯一用色块的地方，其余靠留白和细线分层。
     只用系统字体：离线和国内网络下都能正常显示。 */
  --bg: #F3F4F1; --surface: #FFFFFF; --sunk: #EAECE7; --line: #E0E3DD;
  --ink: #1A2026; --ink2: #5B656E; --ink3: #8E979E;
  --accent: #2C4BB8; --accent-soft: #E7EBF8; --on-accent: #FFFFFF;
  --good: #2B7A58; --good-soft: #E2F0E9; --warn: #8F620E; --warn-soft: #F7EDD6; --crit: #B5433B; --crit-soft: #F8E6E3;
  --p0: #2C4BB8; --p1: #17807B; --p2: #A8561C; --p3: #7445B5; --p4: #3A8442; --p5: #AD3F6C;
  --font: "MiSans", "HarmonyOS Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --num: "DIN Alternate", "Bahnschrift", "Roboto Condensed", "MiSans", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
  --r-panel: 16px; --r-ctl: 10px;
  --lift: 0 1px 0 rgba(26, 32, 38, .03), 0 10px 28px -14px rgba(26, 32, 38, .22);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F1316; --surface: #171C21; --sunk: #20272D; --line: #29313A;
    --ink: #E9ECEE; --ink2: #A9B1B8; --ink3: #737C84;
    --accent: #93A9FF; --accent-soft: #1C2848; --on-accent: #0C1220;
    --good: #63C79A; --good-soft: #14301F; --warn: #E0B25E; --warn-soft: #33270F; --crit: #EE877F; --crit-soft: #3A1917;
    --p0: #93A9FF; --p1: #52C7C1; --p2: #E89B60; --p3: #B99AF0; --p4: #77C784; --p5: #EE8DB4;
    --lift: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -14px rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1316; --surface: #171C21; --sunk: #20272D; --line: #29313A;
  --ink: #E9ECEE; --ink2: #A9B1B8; --ink3: #737C84;
  --accent: #93A9FF; --accent-soft: #1C2848; --on-accent: #0C1220;
  --good: #63C79A; --good-soft: #14301F; --warn: #E0B25E; --warn-soft: #33270F; --crit: #EE877F; --crit-soft: #3A1917;
  --p0: #93A9FF; --p1: #52C7C1; --p2: #E89B60; --p3: #B99AF0; --p4: #77C784; --p5: #EE8DB4;
  --lift: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -14px rgba(0, 0, 0, .6);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

/* 框架 */
#app { display: grid; grid-template-columns: 78px minmax(0, 1fr); height: 100%; }
#nav { display: flex; flex-direction: column; gap: 2px; padding: 18px 0; }
#nav .brand { font-weight: 700; font-size: 16px; text-align: center; padding: 2px 0 20px; letter-spacing: .18em; text-indent: .18em; color: var(--ink); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; color: var(--ink3); font-size: 11.5px; position: relative; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tab:hover { color: var(--ink2); }
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tab[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.tab .dot { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font: 600 10px/16px var(--num); text-align: center; }
#main { overflow-y: auto; min-width: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px 56px 12px; }

/* 随手记 */
#capture { position: sticky; top: 0; z-index: 5; background: linear-gradient(var(--bg) 78%, transparent); padding: 18px 0 14px; }
.cap-box { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 6px 6px 18px; box-shadow: var(--lift); }
.cap-box:focus-within { border-color: var(--accent); }
#cap { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; padding: 9px 0; }
#cap::placeholder { color: var(--ink3); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 15px; border-radius: var(--r-ctl); font-weight: 600; font-size: 14px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
.btn:hover { filter: brightness(.97); }
.btn.pri { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--accent); padding: 0 8px; }
.btn.danger { color: var(--crit); background: var(--crit-soft); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.sm { min-height: 30px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
#chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 4px 0; }
#chips:empty { padding: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--sunk); color: var(--ink2); font-size: 12.5px; white-space: nowrap; }
.chip.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip button { font-size: 14px; line-height: 1; opacity: .7; padding: 2px; }
.pd { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ink3); }
.c0 { --pc: var(--p0); } .c1 { --pc: var(--p1); } .c2 { --pc: var(--p2); } .c3 { --pc: var(--p3); } .c4 { --pc: var(--p4); } .c5 { --pc: var(--p5); }
.pd[class*="c"] { background: var(--pc, var(--ink3)); }
/* 回执与选择题 */
.receipt, .ask { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; width: 100%; font-size: 14px; }
.ask { padding-top: 4px; }
.rc-ok { color: var(--good); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.rc-ok::before { content: ""; width: 9px; height: 5px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg) translateY(-2px); }
.rc-t { font-weight: 600; overflow-wrap: anywhere; }
.rc-m { color: var(--ink2); display: inline-flex; align-items: center; flex-wrap: wrap; }
.rc-m i { width: 1px; height: 12px; background: var(--line); margin: 0 9px; }
.ask-q { color: var(--ink2); }
.opt { min-height: 32px; padding: 0 13px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); font-size: 13.5px; }
.opt:hover { border-color: var(--ink3); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* 版面 */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 0 18px; }
.head h1 { font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
.head .sub { color: var(--ink2); font-size: 14px; margin-top: 5px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border-radius: var(--r-panel); min-width: 0; overflow: hidden; }
.card > h2 { font-size: 13px; font-weight: 600; color: var(--ink3); padding: 15px 18px 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card > h2 .n { font: 500 12.5px var(--num); color: var(--ink3); }
.empty { padding: 10px 18px 18px; color: var(--ink3); font-size: 14px; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { padding: 5px 13px; border-radius: 8px; font-size: 13.5px; color: var(--ink2); min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; }
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px 10px 16px; border-radius: 12px; background: var(--sunk); font-size: 14px; margin-bottom: 14px; color: var(--ink2); }
.banner span { flex: 1; min-width: 200px; }

/* 现在做：页面上唯一的色块 */
.card.focus { background: var(--accent-soft); }
.card.focus .pad { gap: 8px; padding: 16px 18px 18px; }
.card.focus .pmeta b { color: var(--accent); font-size: 13px; }
.card.focus .pmeta { color: var(--ink2); }
.focus-t { text-align: left; font-size: 20px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.card.focus .btns { margin-top: 6px; }
.card.focus .btn:not(.pri) { background: var(--surface); }
.card.advice > h2 { color: var(--accent); }

/* 提示：不用盒子，一行一条 */
.tips { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; }
.tip { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; font-size: 14px; color: var(--ink2); }
.tip::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ink3); transform: translateY(-1px); }
.tip.crit::before { background: var(--crit); } .tip.warn::before { background: var(--warn); } .tip.info::before { background: var(--accent); }
.tip span { flex: 1; min-width: 0; }
.tip .btn { background: none; color: var(--accent); padding: 0 4px; min-height: 24px; }

/* 事项行 */
.row { display: flex; align-items: flex-start; gap: 11px; padding: 11px 16px 11px 18px; border-top: 1px solid var(--line); cursor: pointer; min-width: 0; }
.card > .row:first-of-type, .card > h2 + .row { border-top: 0; }
.row:hover { background: color-mix(in srgb, var(--sunk) 40%, transparent); }
.chk { flex: none; width: 21px; height: 21px; margin-top: 1.5px; border-radius: 50%; border: 1.75px solid var(--ink3); display: grid; place-items: center; }
.chk:hover { border-color: var(--accent); background: var(--accent-soft); }
.done > .chk { background: var(--good); border-color: var(--good); }
.done > .chk::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.done .row-title { color: var(--ink3); text-decoration: line-through; }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 12px; margin-top: 3px; color: var(--ink2); font-size: 12.5px; }
.row-meta > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.row-meta .late { color: var(--crit); font-weight: 600; } .row-meta .soon { color: var(--warn); font-weight: 600; }
.row-meta .chip { height: 21px; padding: 0 8px; font-size: 12px; }
.flag { color: var(--crit); font-weight: 700; margin-right: 6px; font-size: 13px; } .flag.p2 { color: var(--warn); }
.row-side { display: flex; gap: 6px; flex: none; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 46%; }
.grp { padding: 14px 18px 4px; font-size: 12.5px; font-weight: 600; color: var(--ink3); border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
.card > .grp:first-child { border-top: 0; }
.grp + .row { border-top: 0; }
.grp.late { color: var(--crit); }
.indent { border-left: 1.5px solid var(--line); margin-left: 28px; }
.addline { display: flex; gap: 8px; padding: 12px 16px 12px 18px; border-top: 1px solid var(--line); }
.card > .addline:first-child { border-top: 0; }
.addline input { flex: 1; min-width: 0; height: 36px; border: 1px solid transparent; border-radius: 8px; padding: 0 11px; background: var(--bg); font-size: 14.5px; outline: 0; }
.addline input:focus { border-color: var(--accent); }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; color: var(--ink3); font-size: 19px; line-height: 1; display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--sunk); color: var(--accent); }

/* 时间轴：左边钟点，中间一条线，节点表示事项 */
.tl { display: grid; grid-template-columns: 62px minmax(0, 1fr); }
.tl-t { padding: 11px 12px 0 0; text-align: right; font: 600 13.5px/1.5 var(--num); font-variant-numeric: tabular-nums; color: var(--ink2); }
.tl-t small { display: block; font-weight: 400; color: var(--ink3); font-size: 11.5px; line-height: 1.2; }
.tl > .row { border-top: 0; border-left: 1.5px solid var(--line); padding: 9px 16px 9px 18px; position: relative; }
.tl > .row::before { content: ""; position: absolute; left: -5.5px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink3); box-sizing: border-box; }
.tl.fixed > .row::before { background: var(--accent); border-color: var(--accent); }
.tl.fixed .tl-t { color: var(--accent); }
.tl.sug > .row::before { border-style: dotted; }
.tl.sug .row-title { color: var(--ink2); }
.tl.routine > .row { cursor: default; align-items: center; padding-top: 6px; padding-bottom: 6px; }
.tl.routine > .row:hover { background: none; }
.tl.routine > .row::before { width: 6px; height: 6px; left: -3.5px; top: 50%; margin-top: -3px; border: 0; background: var(--line); }
.tl.routine .row-title, .tl.routine .tl-t { color: var(--ink3); font-size: 13.5px; font-weight: 500; }
.tl.routine .tl-t { padding-top: 8px; }
.card > .tl:last-child > .row { padding-bottom: 16px; }
.nowline { display: grid; grid-template-columns: 62px minmax(0, 1fr); align-items: center; height: 22px; background: linear-gradient(var(--line), var(--line)) no-repeat 62px 0 / 1.5px 100%; }
.nowline b { text-align: right; padding-right: 12px; font: 600 11.5px var(--num); color: var(--accent); white-space: nowrap; }
.nowline::after { content: ""; height: 1.5px; background: var(--accent); margin-right: 16px; border-radius: 1px; }
.load { height: 3px; border-radius: 2px; background: var(--sunk); overflow: hidden; margin: 2px 18px 10px; }
.load i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.load.over i { background: var(--crit); }

/* 项目 */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.pcard { text-align: left; padding: 18px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; }
.pcard:hover { box-shadow: var(--lift); }
.pcard h3 { font-size: 16px; font-weight: 700; line-height: 1.35; display: flex; align-items: baseline; gap: 9px; }
.pcard h3::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--pc, var(--ink3)); }
.pcard .next { font-size: 13.5px; color: var(--ink2); overflow-wrap: anywhere; }
.pcard .next b { color: var(--ink3); font-weight: 600; margin-right: 8px; font-size: 12px; }
.bar { height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pc, var(--accent)); border-radius: 2px; }
.pmeta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink2); flex-wrap: wrap; }
.area { font-size: 13px; font-weight: 600; color: var(--ink3); margin: 20px 4px 10px; }
.back { color: var(--accent); font-size: 14px; font-weight: 600; padding: 4px 0; }

/* 作息 */
.rrow { display: flex; align-items: center; gap: 10px; padding: 11px 16px 11px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.card > h2 + .rrow { border-top: 0; }
.rr-n { flex: 1; min-width: 84px; display: flex; flex-direction: column; }
.rr-n b { font-size: 15px; font-weight: 600; }
.rrow input[type="time"] { height: 34px; width: 124px; border: 1px solid transparent; border-radius: 8px; padding: 0 8px; background: var(--bg); font-variant-numeric: tabular-nums; }
.grid7 { width: 100%; border-collapse: collapse; font-size: 13px; }
.grid7 th, .grid7 td { padding: 9px 4px; text-align: center; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.grid7 thead th { border-top: 0; color: var(--ink3); font-weight: 500; font-size: 12px; }
.grid7 th:first-child { text-align: left; padding-left: 18px; color: var(--ink2); white-space: nowrap; font-weight: 500; }
.grid7 td.ok { color: var(--good); font-weight: 600; } .grid7 td.late { color: var(--crit); font-weight: 600; } .grid7 td.miss { color: var(--ink3); }
.grid7 td:last-child { color: var(--ink2); white-space: nowrap; padding-right: 14px; }
.scroll-x { overflow-x: auto; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 6px 18px 18px; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > label, .lbl { font-size: 12.5px; color: var(--ink2); font-weight: 500; }
.fld input, .fld select, .fld textarea { height: 38px; border: 1px solid transparent; border-radius: 9px; padding: 0 11px; background: var(--bg); min-width: 0; width: 100%; outline: 0; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--accent); }
.fld textarea { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; line-height: 1.5; }
.hint { font-size: 12.5px; color: var(--ink3); line-height: 1.6; }

/* 回顾与管家 */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 14px 18px; }
.stat b { display: block; font: 700 28px/1.1 var(--num); }
.stat span { font-size: 13px; color: var(--ink2); }
.pad { padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 16px; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; }
.step::before { counter-increment: s; content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--sunk); color: var(--ink2); font: 600 13px/24px var(--num); text-align: center; }
.step > div { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.oplist { margin: 0; padding: 0 0 0 18px; font-size: 14px; display: flex; flex-direction: column; gap: 3px; }
pre.box, textarea.box { width: 100%; max-height: 220px; overflow: auto; background: var(--bg); border: 0; border-radius: 9px; padding: 11px; font: 12.5px/1.55 ui-monospace, "SF Mono", Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
textarea.box { min-height: 110px; resize: vertical; }

/* 详情抽屉 */
#scrim { position: fixed; inset: 0; background: rgba(15, 19, 22, .38); z-index: 20; }
#sheet { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); box-shadow: var(--lift); overflow-y: auto; display: flex; flex-direction: column; }
#sheet[hidden], #scrim[hidden] { display: none; }
.sh-head { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 14px 8px 22px; z-index: 1; }
.sh-head b { font-size: 12.5px; color: var(--ink3); font-weight: 500; }
.sh-body { padding: 0 22px 30px; display: flex; flex-direction: column; gap: 18px; }
.sh-title { width: 100%; border: 0; border-bottom: 1.5px solid var(--line); background: transparent; font-size: 20px; font-weight: 700; padding: 2px 0 10px; outline: 0; }
.sh-title:focus { border-color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.links { display: flex; flex-direction: column; background: var(--bg); border-radius: 10px; overflow: hidden; }
.links > * { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 14px; text-align: left; min-width: 0; }
.links > *:first-child { border-top: 0; }

<script>
/* 有序 · 核心引擎：纯逻辑，无界面、无网络。浏览器中挂在 window.Core，Node 中为 module.exports。 */
(function (root) {
  'use strict';

  /* ---------- 基础工具 ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseYmd = (s) => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
  const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);
  const toMin = (t) => { const a = t.split(':').map(Number); return a[0] * 60 + a[1]; };
  const toHM = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  const nowHM = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const weekdayName = (s) => WD[parseYmd(s).getDay()];
  const mondayOf = (s) => { const d = parseYmd(s); return addDays(s, -((d.getDay() + 6) % 7)); };

  function fmtDate(s, today) {
    const n = diffDays(s, today);
    if (n === 0) return '今天';
    if (n === 1) return '明天';
    if (n === 2) return '后天';
    if (n === -1) return '昨天';
    const d = parseYmd(s);
    const md = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    if (n > 2 && n < 7) return weekdayName(s);
    if (n < -1) return md + ' · 逾期' + (-n) + '天';
    return md + ' ' + weekdayName(s);
  }
  function fmtDur(min) {
    if (min == null) return '';
    if (min < 60) return min + '分钟';
    const h = min / 60;
    return (Math.round(h * 10) / 10) + '小时';
  }

  const fmtDurX = (m) => m < 60 ? m + '分钟' : (m % 60 === 0 ? (m / 60) + '小时' : m % 60 === 30 ? (m / 60) + '小时' : Math.floor(m / 60) + '小时' + (m % 60) + '分');

  /* ---------- 中文数字 ---------- */
  const CN = { '零': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
  function cnNum(s) {
    if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
    if (s === '半') return 0.5;
    const m = s.match(/^([一二两三四五六七八九])?十([一二三四五六七八九])?$/);
    if (m) return (m[1] ? CN[m[1]] : 1) * 10 + (m[2] ? CN[m[2]] : 0);
    if (s.length === 1 && s in CN) return CN[s];
    return NaN;
  }
  const NUM = '(\\d+(?:\\.\\d+)?|[一二两三四五六七八九十]{1,3}|半)';
  // “前”后面跟这些字时是词的一部分（前驱体、前往、前期…），不是“之前”
  const SUF = '(?:之前|以前|前(?![往面期后提进沿景驱处置端者辈言列电])|截止|为止)?';
  const PERIOD = '(凌晨|清晨|早上|早晨|上午|中午|午后|下午|傍晚|晚上|夜里)';
  const CJK = '\\u4e00-\\u9fff';

  /* ---------- 随手记解析：从一句不规整的话里识别日期、起止时间、时长、截止、重复、地点 ---------- */
  // 口语短语 → 时间含义。内置一批；Claude 顾问会根据你的纠正记录继续补充（存在 state.phrases 里，本机生效）
  const PHRASES = [
    { text: '下班前', set: { day: 0, time: '18:00' } }, { text: '下班后', set: { day: 0, slot: 'evening' } },
    { text: '睡前', set: { day: 0, slot: 'evening', keep: true } },
    { text: '吃完午饭', set: { day: 0, slot: 'afternoon' } }, { text: '午饭后', set: { day: 0, slot: 'afternoon' } }, { text: '午休后', set: { day: 0, slot: 'afternoon' } },
    { text: '吃完晚饭', set: { day: 0, slot: 'evening' } }, { text: '晚饭后', set: { day: 0, slot: 'evening' } }, { text: '早饭后', set: { day: 0, slot: 'morning' } },
    { text: '一会儿', set: { day: 0 } }, { text: '待会儿', set: { day: 0 } }, { text: '待会', set: { day: 0 } }, { text: '等会儿', set: { day: 0 } }, { text: '等会', set: { day: 0 } },
    { text: '等下', set: { day: 0 } }, { text: '稍后', set: { day: 0 } }, { text: '晚点', set: { day: 0 } }, { text: '晚些时候', set: { day: 0 } }
  ];
  const FUZ = { '一两': 2, '两三': 3, '三四': 4, '四五': 5, '五六': 6, '七八': 8 };
  const NUMF = '(\\d+(?:\\.\\d+)?|一两|两三|三四|四五|五六|七八|[一二两三四五六七八九十]{1,3}|半)';
  const numF = (x) => (x in FUZ) ? FUZ[x] : cnNum(x);
  const SEP = '\\s*(?:到|至|-|–|—|~|～)\\s*';
  const CHN = '[一二两三四五六七八九十]{1,3}';
  const TT = '(\\d{1,2}|' + CHN + ')(?:[:：](\\d{2})|\\s*[点时](半|一刻|三刻|(\\d{1,2}|' + CHN + ')分?)?钟?)';
  const PLACE = '(?:楼|室|厅|馆|中心|办公室|会议室|实验室|教室|餐厅|食堂|咖啡厅|咖啡馆|机场|车站|酒店|医院|银行|校区|大厦|广场)';

  function parseCapture(text, now, skip, extra) {
    now = now || new Date(); skip = skip || {}; extra = extra || {};
    const today = ymd(now), nowMin = now.getHours() * 60 + now.getMinutes(), cur = (now.getDay() + 6) % 7;
    let s = ' ' + String(text).trim().replace(/大概|大约|差不多|约莫|左右/g, ' ') + ' ';
    const r = { title: '', due: null, until: null, time: null, est: null, priority: 1, projectHint: null, slot: null, follow: false, repeat: null, repeatDays: null, by: false, when: null, where: null, found: {}, asks: [] };
    // 你的习惯：有歧义的说法，按你上次的选择来理解；asks 是这句话里仍可能有歧义的地方（界面会给出选择题）
    const H = extra.habits || {}, hv = (k) => (H[k] && H[k].v != null) ? H[k].v : null;
    const pick = (k, def, ok) => { const v = hv(k); return v != null && (!ok || ok.indexOf(String(v)) >= 0) ? v : def; };
    const cut = (re, fn) => {
      s = s.replace(re, function () {
        const a = Array.prototype.slice.call(arguments);
        const keep = fn.apply(null, a);
        return keep === false ? a[0] : (typeof keep === 'string' ? keep : ' ');
      });
    };
    const setDue = (d, raw, by) => { if (r.due) return false; r.due = d; r.found.due = raw.trim(); r.by = by != null ? by : /(之前|以前|前|截止|为止|之内|以内|内)$/.test(raw.trim()); return true; };
    const slotOf = (p) => /早|上午|清晨/.test(p) ? 'morning' : /中午/.test(p) ? 'noon' : /下午|午后/.test(p) ? 'afternoon' : /凌晨/.test(p) ? null : 'evening';
    const wd = (w) => w === '末' ? 5 : (w === '日' || w === '天') ? 6 : CN[w] - 1;
    const mdDate = (y, mo, d) => { if (mo < 1 || mo > 12 || d < 1 || d > 31) return null; let dt = new Date(y || now.getFullYear(), mo - 1, d); if (!y && diffDays(ymd(dt), today) < -60) dt = new Date(now.getFullYear() + 1, mo - 1, d); return ymd(dt); };
    const dayOfMonth = (d) => { let dt = new Date(now.getFullYear(), now.getMonth(), d); if (ymd(dt) < today) dt = new Date(now.getFullYear(), now.getMonth() + 1, d); return ymd(dt); };

    // 地点（明确写出的：地址是… / 地点：… / @…）
    if (!skip.where) {
      cut(/(?:地址|地点|位置)\s*(?:是|在|为|:|：)?\s*([^\s，,。;；]{2,30})/, (m, w) => { r.where = w; r.found.where = m.trim(); });
      if (!r.where) cut(/(\s)@([^\s，,。;；@]{2,30})/, (m, pre, w) => { r.where = w; r.found.where = m.trim(); });
    }
    // 项目标记 #项目
    if (!skip.project) cut(/#([^\s#]+)/, (m, p) => { r.projectHint = p; r.found.project = m; });
    // 优先级
    if (!skip.priority) {
      cut(/[!！]{2,}/, (m) => { r.priority = 3; r.found.priority = m; });
      cut(/[!！]/, (m) => { if (r.priority < 2) { r.priority = 2; r.found.priority = m; } });
      if (/紧急|加急|尽快|马上|立刻|asap/i.test(s)) { r.priority = 3; r.found.priority = r.found.priority || '紧急'; }
      else if (/重要|一定要|务必/.test(s) && r.priority < 2) { r.priority = 2; r.found.priority = '重要'; }
    }
    // 口语短语：先摘出来，等明确的日期时间都认完再补上（明确写的优先）
    const pend = [];
    if (!skip.phrase) {
      (extra.phrases || []).filter((p) => p && !p.deleted && p.text).map((p) => ({ text: String(p.text), set: p.set || {} })).concat(PHRASES)
        .sort((a, b) => b.text.length - a.text.length).forEach((ph) => { const i = s.indexOf(ph.text); if (i < 0) return; pend.push(ph); if (!ph.set.keep) s = s.slice(0, i) + ' ' + s.slice(i + ph.text.length); });
    }

    // 重复：每天 / 每个工作日 / 每周三 / 每周一三五 / 每两周 / 每月5号
    if (!skip.repeat) {
      const setRep = (v, raw) => { if (r.repeat) return false; r.repeat = v; r.found.repeat = raw.trim(); return true; };
      cut(/每个?工作日/, (m) => setRep('weekday', m));
      cut(/每(?:天|日)/, (m) => setRep('day', m));
      cut(/每个?(?:周|星期|礼拜)([一二三四五六日天]{2,7})/, (m, ws) => {
        if (!setRep('week', m)) return false;
        r.repeatDays = Array.from(new Set(ws.split('').map(wd))).sort();
        if (!r.due) { let k = 0; while (r.repeatDays.indexOf((cur + k) % 7) < 0 && k < 7) k++; r.due = addDays(today, k); }
      });
      cut(/每(两|2|隔一)?个?(?:周|星期|礼拜)([一二三四五六日天])?/, (m, two, w) => {
        if (!setRep(two ? '2week' : 'week', m)) return false;
        if (w && !r.due) { let dl = wd(w) - cur; if (dl < 0) dl += 7; r.due = addDays(today, dl); }
      });
      cut(/每个?月(?:(\d{1,2})[号日])?/, (m, d) => { if (!setRep('month', m)) return false; if (d && +d >= 1 && +d <= 31 && !r.due) r.due = dayOfMonth(+d); });
    }

    let attr = null;   // “明天的PPT”这类：日期是修饰语，只在没有别的日期时当作截止
    if (!skip.due) {
      // N小时后 / N分钟后
      cut(new RegExp(NUM + '\\s*个?(小时|钟头|h|分钟|min)(?:之后|以后|后)', 'i'), (m, n, u) => {
        const v = cnNum(n); if (isNaN(v) || r.due) return false;
        const t = nowMin + Math.round(v * (/分|min/i.test(u) ? 1 : 60));
        r.due = addDays(today, Math.floor(t / 1440)); r.time = toHM(t); r.found.due = m.trim(); r.found.time = m.trim();
      });
      // 跨多天：11月20日到22日 / 20号到22号 / 下周一到周三
      cut(new RegExp('(\\d{1,2})月(\\d{1,2})[日号]?' + SEP + '(?:(\\d{1,2})月)?(\\d{1,2})[日号]?(?!\\s*[点时:：\\d])'), (m, mo, d, mo2, d2) => {
        const a = mdDate(0, +mo, +d), b = mdDate(0, +(mo2 || mo), +d2); if (!a || !b || b < a || r.due) return false;
        r.due = a; r.until = b; r.found.due = m.trim();
      });
      cut(new RegExp('(^|[^\\d月])(\\d{1,2})[号日]' + SEP + '(\\d{1,2})[号日]'), (m, pre, d, d2) => {
        if (r.due || +d < 1 || +d > 31 || +d2 < +d || +d2 > 31) return false;
        const a = dayOfMonth(+d); r.due = a; r.until = addDays(a, +d2 - +d); r.found.due = m.slice(pre.length).trim(); return pre + ' ';
      });
      cut(new RegExp('(下下|下|这|本)?个?(?:周|星期|礼拜)([一二三四五六日天])' + SEP + '(?:周|星期|礼拜)?([一二三四五六日天])(?!\\s*[点时])'), (m, pre, w, w2) => {
        if (r.due) return false;
        let delta = wd(w) - cur; if (pre === '下') delta += 7; else if (pre === '下下') delta += 14; else if (!pre && delta < 0) delta += 7;
        const span = wd(w2) - wd(w); if (span <= 0) return false;
        r.due = addDays(today, delta); r.until = addDays(r.due, span); r.found.due = m.trim();
      });
      // 绝对日期
      cut(new RegExp('(\\d{4})[-/.年](\\d{1,2})[-/.月](\\d{1,2})[日号]?' + SUF), (m, y, mo, d) => { const x = mdDate(+y, +mo, +d); return x ? setDue(x, m) : false; });
      cut(new RegExp('(\\d{1,2})月(\\d{1,2})[日号]?' + SUF), (m, mo, d) => { const x = mdDate(0, +mo, +d); return x ? setDue(x, m) : false; });
      cut(new RegExp('(\\s)(\\d{1,2})/(\\d{1,2})(?![\\d/.])' + SUF), (m, sp, mo, d) => { const x = mdDate(0, +mo, +d); return x && setDue(x, m) ? ' ' : false; });
      cut(new RegExp('(^|[^\\d月])(\\d{1,2})[号日](?=\\s|前|之前|以前|上午|下午|晚上|早上|中午|[,，。;；])' + SUF), (m, pre, d) => {
        d = +d; if (d < 1 || d > 31) return false;
        return setDue(dayOfMonth(d), m.slice(pre.length)) ? pre + ' ' : false;
      });
      // 相对日期：3天后 / 两三天内 / 一周内
      cut(new RegExp(NUMF + '\\s*个?(天|日|周|星期|礼拜|月)(之后|以后|后|之内|以内|内)'), (m, n, u, tail) => {
        const v = numF(n); if (isNaN(v)) return false;
        const k = u === '月' ? 30 : /周|星期|礼拜/.test(u) ? 7 : 1;
        return setDue(addDays(today, Math.round(v * k)), m, /内/.test(tail));
      });
      cut(new RegExp('明后天' + SUF), (m) => setDue(addDays(today, 2), m, true));
      cut(new RegExp('(大后天|后天|明天|明日|明早|明晚|今天|今日|今早|今晚)(的)?' + SUF), (m, w, de) => {
        const n = w === '大后天' ? 3 : w === '后天' ? 2 : /^明/.test(w) ? 1 : 0;
        if (de) { if (!attr) attr = addDays(today, n); return false; }
        if (!setDue(addDays(today, n), m)) return false;
        if (/早$/.test(w)) r.slot = 'morning'; if (/晚$/.test(w)) r.slot = 'evening';
      });
      // 星期
      cut(new RegExp('(下下|下|这|本)?个?(?:周|星期|礼拜)([一二三四五六日天末])' + SUF), (m, pre, w) => {
        let day = wd(w);
        if (w === '末') { const c = pick('weekend', 'sat', ['sat', 'sun']); day = c === 'sun' ? 6 : 5; r.asks.push({ key: 'weekend', q: '周末是指', cur: c, opts: [{ v: 'sat', label: '周六' }, { v: 'sun', label: '周日' }] }); }
        let delta = day - cur;
        if (pre === '下') delta += 7; else if (pre === '下下') delta += 14; else if (!pre && delta < 0) delta += 7;
        return setDue(addDays(today, delta), m);
      });
      // “下周”不带星期几：那一周内做完即可，按周五截止
      cut(new RegExp('(下下|下)个?(?:周|星期|礼拜)' + SUF), (m, pre) => {
        if (r.due) return false;
        const c = pick('nextweek', 'fri', ['fri', 'mon']), base = -cur + (pre === '下' ? 7 : 14);
        r.asks.push({ key: 'nextweek', q: '“' + m.trim() + '”是指', cur: c, opts: [{ v: 'fri', label: '那一周内做完' }, { v: 'mon', label: '周一就做' }] });
        return setDue(addDays(today, base + (c === 'mon' ? 0 : 4)), m, c !== 'mon');
      });
      cut(/(?:本|这)个?(?:周|星期)(?:之内|以内|内)?/, (m) => setDue(addDays(today, 6 - cur), m, true));
      cut(new RegExp('(这个?|本|下个?)?月底' + SUF), (m, nx) => setDue(ymd(new Date(now.getFullYear(), now.getMonth() + (nx && /下/.test(nx) ? 2 : 1), 0)), m, true));
      cut(new RegExp('(这个?|本|下个?)?月中' + SUF), (m, nx) => { let dt = new Date(now.getFullYear(), now.getMonth() + (nx && /下/.test(nx) ? 1 : 0), 15); if (ymd(dt) < today) dt = new Date(now.getFullYear(), now.getMonth() + 1, 15); return setDue(ymd(dt), m); });

  /* ---------- 自动归类：用每个项目里已有的事项做样本，越用越准 ---------- */

        for (let i = 0; i < w.length - 1; i++) { const b = w.slice(i, i + 2); if (!STOP.has(b)) out.push(b); }

    }

  function buildModel(state) {

    const projects = state.projects.filter((p) => !p.deleted && !p.archived);
    projects.forEach((p) => {
      const c = new Map();
      tokens(p.name).forEach((t) => c.set(t, (c.get(t) || 0) + 3));
      P[p.id] = { counts: c, keywords: (p.keywords || []).map((k) => k.toLowerCase()).filter(Boolean) };
    });
    state.items.forEach((it) => {
      if (it.deleted || !it.projectId || !P[it.projectId]) return;
      const c = P[it.projectId].counts;
      new Set(tokens(it.title)).forEach((t) => c.set(t, (c.get(t) || 0) + 1));
    });

    Object.keys(P).forEach((id) => P[id].counts.forEach((v, t) => df.set(t, (df.get(t) || 0) + 1)));

  function classify(model, text) {

  /* ---------- 状态与事项关系 ---------- */
  function newState() {
    return {

  }

  }

  /** 一句话 → 事项（含自动归类）。返回 {item, guess} */

  }
  /** 你说“不对”时给出的通用选择题：日期、钟点、时长各一行。都不对再手填 */
  function alternatives(item, now, have) {
    now = now || new Date(); have = have || {};
    const today = ymd(now), rows = [], uniq = (xs) => xs.filter((o, i) => xs.findIndex((y) => y.v === o.v) === i);
    if (!have.due && !item.until) rows.push({ field: 'due', q: '哪天', cur: item.due || '', opts: uniq([{ v: today, label: '今天' }, { v: addDays(today, 1), label: '明天' }].concat(item.due ? [{ v: item.due, label: fmtDate(item.due, today) }] : []).concat([{ v: '', label: '不定日子' }])) });
    if (item.time && !have.time) { const m = toMin(item.time); rows.push({ field: 'time', q: '几点', cur: item.time, opts: [{ v: item.time, label: item.time }, { v: toHM(m + 720), label: toHM(m + 720) }, { v: '', label: '不定钟点' }] }); }
    if (!have.est && !item.until) rows.push({ field: 'est', q: '大概多久', cur: item.est ? String(item.est) : null, opts: uniq([30, 60, 90, 120].concat(item.est ? [item.est] : []).sort((a, b) => a - b).map((m) => ({ v: String(m), label: fmtDurX(m) }))) });
    return rows;
  }
  /** 你手动改了日期、钟点或时长：反推是哪种理解才对，把那个理解记成新的习惯（习惯会变，以最近一次为准） */
  function learnFromCorrection(state, it) {
    if (!it || !it.raw) return [];
    const created = new Date(it.createdAt), sk = {}; (it.rawSkip || []).forEach((k) => { sk[k] = true; });
    const parse = (hab) => parseCapture(it.raw, created, sk, { phrases: state.phrases, habits: hab });
    const dt = (p) => (p.due || null) === (it.due || null) && (p.time || null) === (it.time || null), es = (p) => (p.est || null) === (it.est || null);
    const base = parse(state.habits || {}), out = [];
    base.asks.forEach((a) => {
      const isDur = /^dur:/.test(a.key);
      if (isDur ? es(base) : dt(base)) return;
      a.opts.forEach((o) => {
        if (String(o.v) === String(a.cur) || out.indexOf(a.key) >= 0) return;
        const h = Object.assign({}, state.habits || {}); h[a.key] = { v: o.v, n: 1 };
        const p2 = parse(h);
        if (isDur ? es(p2) : dt(p2)) { state.habits = state.habits || {}; state.habits[a.key] = { v: o.v, n: 1, updatedAt: Date.now() }; out.push(a.key); }
      });
    });
    return out;
  }
  function setDone(state, it, done, now) {
    now = now || new Date();
    it.status = done ? 'done' : 'todo'; it.doneAt = done ? now.getTime() : null; it.updatedAt = Date.now();
    if (done && it.startedAt) { const m = Math.round((now.getTime() - it.startedAt) / 60000); if (m >= 3 && m <= 600) it.actual = m; }
    // 重复事项：完成后自动生成下一次
    if (done && it.repeat && !(it.nextId && byId(state, it.nextId))) {
      const nx = makeItem({ title: it.title, note: it.note, projectId: it.projectId, parentId: it.parentId, time: it.time, est: it.est, priority: it.priority, slot: it.slot, repeat: it.repeat, repeatDays: it.repeatDays, where: it.where, due: nextDue(it.due, it.repeat, ymd(now), it.repeatDays) });
      state.items.push(nx); it.nextId = nx.id;
    }
    // 小事都做完时，大事自动完成
    if (done && it.parentId) {
      const par = byId(state, it.parentId);
      if (par && par.status !== 'done' && childrenOf(state, par.id).every((c) => c.status === 'done')) setDone(state, par, true, now);
    }
  }
  function followUp(state, it, days, title, now) {
    const f = makeItem({
      title: title || ('跟进：' + it.title.replace(/^(跟进|复盘并重做)：/, '')), projectId: it.projectId, parentId: it.parentId,
      due: addDays(ymd(now || new Date()), days), followOf: it.id, kind: 'follow', est: 15
    });
    state.items.push(f); return f;
  }
  function chainOf(state, it) {
    let head = it; const seen = new Set();
    while (head.followOf && byId(state, head.followOf) && !seen.has(head.id)) { seen.add(head.id); head = byId(state, head.followOf); }
    const out = [head];
    for (let i = 0; i < out.length && i < 50; i++) state.items.forEach((x) => { if (!x.deleted && x.followOf === out[i].id && out.indexOf(x) < 0) out.push(x); });
    return out.length > 1 ? out : [];
  }

  /* ---------- 每日排程 ---------- */
  function planDay(state, date, now) {
    now = now || new Date();
    const today = ymd(now), isToday = date === today;
    const T = state.routine.targets, S = state.settings;
    let sleepMin = toMin(T.sleep); if (sleepMin < 12 * 60) sleepMin += 1440;
    const dayEnd = Math.min(1440, sleepMin - (S.windDown || 45));
    const dayStart = toMin(S.workStart || '08:30');
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const cursor = isToday ? Math.max(dayStart, Math.ceil(nowMin / 5) * 5) : dayStart;
    const blocks = [];
    const log = (state.routine.log[date] || {});
    const meals = [['breakfast', 30], ['lunch', 40], ['dinner', 40]];
    blocks.push({ s: toMin(T.wake), e: toMin(T.wake), type: 'routine', key: 'wake', label: '起床', actual: log.wake || null });
    const busy = [];
    meals.forEach((m) => { const s = toMin(T[m[0]]); busy.push([s, s + m[1]]); blocks.push({ s: s, e: s + m[1], type: 'routine', key: m[0], label: ROUTINE_NAME[m[0]], actual: log[m[0]] || null }); });
    blocks.push({ s: Math.min(sleepMin, 1439), e: Math.min(sleepMin, 1439), type: 'routine', key: 'sleep', label: '睡觉', actual: log.sleep || null, target: T.sleep });

    const openAll = state.items.filter((i) => !i.deleted && i.status !== 'done' && !isContainer(state, i));
    const spans = openAll.filter((i) => i.until && i.due <= date && i.until >= date);   // 跨多天的事（出差、会议）：当天只作提示，不占排程
    const open = openAll.filter((i) => !i.until);
    const fixed = open.filter((i) => i.time && i.due === date);
    fixed.forEach((i) => { const s = toMin(i.time), e = s + (i.est || 30); busy.push([s, e]); blocks.push({ s: s, e: e, type: 'fixed', itemId: i.id, label: i.title }); });

    // 空闲时段
    busy.sort((a, b) => a[0] - b[0]);
    let free = []; let c = cursor;
    busy.forEach((b) => { if (b[1] <= c) return; if (b[0] > c) free.push([c, Math.min(b[0], dayEnd)]); c = Math.max(c, b[1]); });
    if (c < dayEnd) free.push([c, dayEnd]);
    free = free.filter((f) => f[1] - f[0] >= 10);
    const capacity = free.reduce((a, f) => a + f[1] - f[0], 0);

    const cand = open.filter((i) => !(i.time && i.due === date) && i.status !== 'waiting' && !blockers(state, i).length);
    const score = (i) => (i.priority || 1) * 10 + (i.due ? Math.min(15, Math.max(0, diffDays(date, i.due)) * 3) + (i.due <= date ? 8 : 0) : 0) + (i.status === 'doing' ? 5 : 0) + (i.planDate === date ? 6 : 0);
    // 截止型的大事提前开工：每 2 小时工作量提前一天
    const lead = (i) => (i.by && (i.est || 0) >= 90) ? Math.ceil(i.est / 120) : 0;
    const age = (i) => Math.min(6, Math.floor((parseYmd(date).getTime() - (i.createdAt || 0)) / 864e5 / 2));
    const must = cand.filter((i) => (i.due && (i.due <= date || (lead(i) && diffDays(i.due, date) <= lead(i)))) || i.planDate === date || i.status === 'doing').sort((a, b) => score(b) - score(a));
    const mustIds = new Set(must.map((i) => i.id));
    // 有空时顺手做的：三天内到期的，以及没定日子、但不是“以后再说”的（越重要、放得越久越靠前）
    const soft = (i) => score(i) + (i.due ? 4 : 0) + (i.when === 'soon' ? 6 : 0) + (i.due ? 0 : Math.max(0, age(i)));
    const maybe = cand.filter((i) => !mustIds.has(i.id) && ((i.due && diffDays(i.due, date) <= (i.by ? 6 : 3)) || (!i.due && i.when !== 'someday')))
      .sort((a, b) => soft(b) - soft(a) || (a.due || '9').localeCompare(b.due || '9') || (a.createdAt || 0) - (b.createdAt || 0)).slice(0, 3);

    const overflow = []; let planned = 0;
    const place = (it, suggested) => {
      let need = it.est || 30; const total = need; const parts = [];
      const minStart = it.slot === 'evening' ? 17 * 60 : (it.slot === 'afternoon' || it.slot === 'noon') ? 12 * 60 : 0;
      const snapshot = free.map((f) => f.slice());
      for (let k = 0; k < free.length && need > 0; k++) {
        const f = free[k];
        const st = Math.max(f[0], minStart); const len = f[1] - st;
        if (len < Math.min(25, need)) continue;
        if (suggested && len < need) continue;
        const chunk = Math.min(need, len);
        parts.push([st, st + chunk]); need -= chunk;
        if (st > f[0] + 10) { free.splice(k, 1, [f[0], st], [st + chunk + 5, f[1]]); k++; } else f[0] = st + chunk + 5;
      }
      if (suggested && need > 0) { free = snapshot; return; }
      parts.forEach((p, idx) => blocks.push({ s: p[0], e: p[1], type: 'task', itemId: it.id, label: it.title, suggested: !!suggested, part: parts.length > 1 ? idx + 1 : 0 }));
      if (!suggested) planned += total;
      if (need > 0) overflow.push({ itemId: it.id, left: need, none: parts.length === 0 });
    };
    if (date >= today) {
      must.forEach((i) => place(i, false));
      const fixedMin = fixed.reduce((a, i) => a + (i.est || 30), 0);
      let budget = Math.max(0, capacity * 0.7 - planned);
      maybe.forEach((i) => { const e = i.est || 30; if (e <= budget) { place(i, true); budget -= e; } });
      planned += fixedMin;
    }
    blocks.sort((a, b) => a.s - b.s || (a.type === 'routine' ? -1 : 1));
    return { date: date, blocks: blocks, overflow: overflow, capacity: capacity, planned: planned, count: must.length + fixed.length, dayEnd: dayEnd, spans: spans };
  }

  /* ---------- 每天开工前的自动整理 ----------
     “哪天做”的事没做完，自动顺延到今天并计一次改期；有截止日或固定钟点的事不动，过期了才算逾期；跨多天的事结束后自动完成 */
  function rollover(state, now) {
    now = now || new Date(); const today = ymd(now); let n = 0;
    state.items.forEach((i) => {
      if (i.deleted || i.status === 'done') return;
      if (i.until) { if (i.until < today) { setDone(state, i, true, now); n++; } return; }
      if (i.due && i.due < today && !i.by && !i.time && !isContainer(state, i)) { i.due = today; i.deferred = (i.deferred || 0) + 1; i.updatedAt = Date.now(); n++; }
    });
    return n;
  }

  /* ---------- 作息 ---------- */
  function routineDateFor(key, now) {
    const d = ymd(now);
    return (key === 'sleep' && now.getHours() < 6) ? addDays(d, -1) : d;
  }
  function routineJudge(key, target, actual, tol) {
    let dev = toMin(actual) - toMin(target);
    if (dev < -720) dev += 1440; if (dev > 720) dev -= 1440;
    return { dev: dev, ok: dev <= tol };
  }
  function routineStats(state, endDate, days, today) {
    const T = state.routine.targets, tol = state.settings.tol || 30, out = {};
    ROUTINE_KEYS.forEach((k) => {
      const rec = { ok: 0, late: 0, miss: 0, pending: 0, devSum: 0, n: 0, days: [] };
      for (let i = days - 1; i >= 0; i--) {
        const d = addDays(endDate, -i); const a = (state.routine.log[d] || {})[k];
        if (a) { const j = routineJudge(k, T[k], a, tol); rec[j.ok ? 'ok' : 'late']++; rec.devSum += j.dev; rec.n++; rec.days.push({ date: d, actual: a, ok: j.ok, dev: j.dev }); }
        else if (d >= today) { rec.pending++; rec.days.push({ date: d, pending: true }); }
        else { rec.miss++; rec.days.push({ date: d, miss: true }); }
      }
      rec.avgDev = rec.n ? Math.round(rec.devSum / rec.n) : null;
      out[k] = rec;
    });
    return out;
  }

  /* ---------- 管家提示：基于规则，不依赖 AI ---------- */
  function insights(state, now) {
    now = now || new Date();
    const today = ymd(now), out = [];
    const open = state.items.filter((i) => !i.deleted && i.status !== 'done' && !isContainer(state, i));
    const plan = planDay(state, today, now);
    const over = open.filter((i) => i.due && i.due < today && !i.until);
    if (plan.overflow.length) {
      const left = plan.overflow.reduce((a, o) => a + o.left, 0);
      out.push({ level: 'crit', text: '今天排不下：还差 ' + fmtDur(left) + '。建议把 ' + plan.overflow.length + ' 件事改到明天，保住今晚 ' + state.routine.targets.sleep + ' 睡觉。', action: 'defer-overflow', label: '改到明天' });
    }
    if (over.length) out.push({ level: 'warn', text: over.length + ' 件事已逾期，最久的是「' + over.sort((a, b) => a.due.localeCompare(b.due))[0].title + '」。', action: 'filter-overdue', label: '查看' });
    const drift = open.filter((i) => (i.deferred || 0) >= 3).sort((a, b) => b.deferred - a.deferred)[0];
    if (drift) out.push({ level: 'warn', text: '「' + drift.title + '」已经改期 ' + drift.deferred + ' 次。拆成更小的一步，或者决定不做。', action: 'open:' + drift.id, label: '打开' });
    const stale = open.filter((i) => !i.due && i.when !== 'someday' && i.status !== 'waiting' && now.getTime() - (i.createdAt || 0) > 10 * 864e5);
    if (stale.length) out.push({ level: 'info', text: stale.length + ' 件没定日子的事已经放了 10 天以上，例如「' + stale.sort((a, b) => a.createdAt - b.createdAt)[0].title + '」。定个日子，或者改成“以后再说”。', action: 'filter-open', label: '去处理' });
    const inbox = open.filter((i) => !i.projectId);
    if (inbox.length >= 3) out.push({ level: 'info', text: '收件箱里有 ' + inbox.length + ' 件事还没归到项目。', action: 'filter-inbox', label: '去归类' });
    const waiting = open.filter((i) => i.status === 'waiting' && (now.getTime() - i.updatedAt) > 5 * 864e5);
    if (waiting.length) out.push({ level: 'warn', text: '「' + waiting[0].title + '」已等待 ' + Math.floor((now.getTime() - waiting[0].updatedAt) / 864e5) + ' 天，该催一下了。', action: 'open:' + waiting[0].id, label: '打开' });
    state.projects.filter((p) => !p.deleted && !p.archived).forEach((p) => {
      const its = state.items.filter((i) => !i.deleted && i.projectId === p.id);
      const act = its.filter((i) => i.status !== 'done' && !isContainer(state, i));
      if (its.length && !act.length) out.push({ level: 'info', text: '项目「' + p.name + '」没有下一步了。完成了就归档，没完成就记下一步。', action: 'project:' + p.id, label: '打开项目' });
      else if (act.length && act.every((i) => i.status === 'waiting' || blockers(state, i).length)) out.push({ level: 'warn', text: '项目「' + p.name + '」卡住了：剩下的事都在等待或被前置事项挡住。', action: 'project:' + p.id, label: '打开项目' });
      if (p.deadline && diffDays(p.deadline, today) <= 14 && diffDays(p.deadline, today) >= 0 && act.length) {
        const need = act.reduce((a, i) => a + (i.est || 30), 0);
        out.push({ level: 'warn', text: '「' + p.name + '」还有 ' + diffDays(p.deadline, today) + ' 天截止，剩 ' + act.length + ' 件事，约 ' + fmtDur(need) + '。', action: 'project:' + p.id, label: '打开项目' });

    if (st.sleep.n >= 3 && st.sleep.late / st.sleep.n >= 0.5) out.push({ level: 'warn', text: '过去 7 天有 ' + st.sleep.late + ' 天晚睡，平均晚 ' + Math.max(0, st.sleep.avgDev) + ' 分钟。今天 ' + toHM(plan.dayEnd) + ' 之后不再排工作。' });
    const mealMiss = ['breakfast', 'lunch', 'dinner'].reduce((a, k) => a + st[k].miss + st[k].late, 0);
    const mealN = ['breakfast', 'lunch', 'dinner'].reduce((a, k) => a + st[k].n, 0);
    if (mealN >= 6 && mealMiss >= 8) out.push({ level: 'info', text: '过去 7 天有 ' + mealMiss + ' 餐没按时吃或没打卡。吃饭时间已固定排进今天的时间轴。' });
    const order = { crit: 0, warn: 1, info: 2 };
    return out.sort((a, b) => order[a.level] - order[b.level]);
  }

  /* ---------- 每周回顾 ---------- */
  function weeklyReview(state, anyDate, now) {
    now = now || new Date();
    const today = ymd(now), mon = mondayOf(anyDate), sun = addDays(mon, 6);
    const t0 = parseYmd(mon).getTime(), t1 = parseYmd(addDays(sun, 1)).getTime();
    const live = state.items.filter((i) => !i.deleted);
    const done = live.filter((i) => i.status === 'done' && i.doneAt >= t0 && i.doneAt < t1 && !isContainer(state, i));
    const added = live.filter((i) => i.createdAt >= t0 && i.createdAt < t1);
    const ref = sun < today ? sun : today;
    const slipped = live.filter((i) => i.status !== 'done' && i.due && i.due >= mon && i.due <= ref && i.due < today && !isContainer(state, i));
    const next = live.filter((i) => i.status !== 'done' && i.due && i.due > sun && i.due <= addDays(sun, 7) && !isContainer(state, i)).sort((a, b) => a.due.localeCompare(b.due));
    const perProject = {};
    done.forEach((i) => { const k = i.projectId || '_'; (perProject[k] = perProject[k] || { done: [], min: 0 }); perProject[k].done.push(i); perProject[k].min += (i.est || 30); });
    const failed = live.filter((i) => i.result === 'fail' && i.doneAt >= t0 && i.doneAt < t1);
    return { mon: mon, sun: sun, done: done, added: added, slipped: slipped, next: next, perProject: perProject, failed: failed, routine: routineStats(state, sun, 7, today) };
  }
  function reviewText(state, rv) {
    const pn = (id) => { const p = state.projects.find((x) => x.id === id); return p ? p.name : '未归类'; };
    const L = ['每周回顾 ' + rv.mon + ' 至 ' + rv.sun, '', '完成 ' + rv.done.length + ' 件，新增 ' + rv.added.length + ' 件，拖延 ' + rv.slipped.length + ' 件'];
    Object.keys(rv.perProject).forEach((k) => { L.push('', '【' + pn(k === '_' ? null : k) + '】约 ' + fmtDur(rv.perProject[k].min)); rv.perProject[k].done.forEach((i) => L.push('  ✓ ' + i.title)); });
    if (rv.slipped.length) { L.push('', '【拖延】'); rv.slipped.forEach((i) => L.push('  · ' + i.title + '（原定 ' + i.due + '）')); }
    if (rv.failed.length) { L.push('', '【失败与复盘】'); rv.failed.forEach((i) => L.push('  · ' + i.title + (i.note ? '：' + i.note : ''))); }
    L.push('', '【作息】');
    ROUTINE_KEYS.forEach((k) => { const r = rv.routine[k]; L.push('  ' + ROUTINE_NAME[k] + '：准时 ' + r.ok + ' 天，偏晚 ' + r.late + ' 天，未打卡 ' + r.miss + ' 天'); });
    if (rv.next.length) { L.push('', '【下周到期】'); rv.next.forEach((i) => L.push('  · ' + i.due.slice(5) + ' ' + i.title)); }
    return L.join('\n');
  }

  /* ---------- 日历导出（.ics，浮动本地时间，换时区后仍按当地钟点提醒） ---------- */
  function makeICS(state, now) {
    now = now || new Date();
    const esc = (s) => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
    const dt = (d, t) => d.replace(/-/g, '') + 'T' + t.replace(':', '') + '00';
    const stamp = now.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Youxu//Planner//ZH', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:有序'];
    const ev = (uidv, lines, alarm, desc) => { L.push('BEGIN:VEVENT', 'UID:' + uidv + '@youxu', 'DTSTAMP:' + stamp); lines.forEach((x) => L.push(x)); L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc(desc), 'TRIGGER:' + alarm, 'END:VALARM', 'END:VEVENT'); };
    const today = ymd(now);
    state.items.filter((i) => !i.deleted && i.status !== 'done' && i.due && (i.until || i.due) >= today && !isContainer(state, i)).forEach((i) => {
      const loc = i.where ? ['LOCATION:' + esc(i.where)] : [];
      if (i.until) { ev(i.id, ['DTSTART;VALUE=DATE:' + i.due.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + addDays(i.until, 1).replace(/-/g, ''), 'SUMMARY:' + esc(i.title)].concat(loc), '-PT15H', i.title); return; }
      if (i.time) {
        const end = toMin(i.time) + (i.est || 30);
        ev(i.id, ['DTSTART:' + dt(i.due, i.time), 'DTEND:' + dt(end >= 1440 ? addDays(i.due, 1) : i.due, toHM(end)), 'SUMMARY:' + esc(i.title)].concat(loc), '-PT10M', i.title);
      } else {
        ev(i.id, ['DTSTART;VALUE=DATE:' + i.due.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + addDays(i.due, 1).replace(/-/g, ''), 'SUMMARY:' + esc((i.kind === 'follow' ? '跟进 · ' : '到期 · ') + i.title.replace(/^跟进：/, ''))], 'PT9H', i.title);
      }
    });

  }
  function formRemotes() {

  const failMsg = (e) => ({ ok: false, text: e.message, code: e.code });

  /* ---------- 通用片段 ---------- */
  function meta(it, o) {
    o = o || {}; const today = todayStr(), a = [];

  const card = (title, body, n, extra) => '<section class="card"><h2><span>' + title + '</span>' + (extra || (n != null ? '<span class="n">' + n + '</span>' : '')) + '</h2>' + body + '</section>';
  const seg = (action, cur, opts) => '<div class="seg" role="group">' + opts.map((o) => '<button data-a="' + action + '" data-v="' + o[0] + '" aria-pressed="' + (String(cur) === String(o[0])) + '">' + o[1] + '</button>').join('') + '</div>';

  /* ---------- 今天 ---------- */
  function vToday() {
    const now = new Date(), today = C.ymd(now), date = C.addDays(today, ui.day), isToday = ui.day === 0;
    const plan = C.planDay(S, date, now), nowMin = now.getHours() * 60 + now.getMinutes(), d = C.parseYmd(date), tol = S.settings.tol;
    const fixedMin = plan.blocks.filter((b) => b.type === 'fixed').reduce((a, b) => a + b.e - b.s, 0);
    const over = plan.overflow.length > 0;
    const sum = plan.count ? plan.count + ' 件事，约 ' + C.fmtDur(plan.planned) + '；' + (isToday ? '到睡前还能用 ' : '全天可用 ') + C.fmtDur(plan.capacity + fixedMin) : (isToday ? '今天没有必须做的事。' : '明天还没有安排。');

    h += '<div class="head"><div><h1>' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + C.weekdayName(date) + '</h1><p class="sub">' + sum + syncLine() + '</p></div><div class="btns">' + (canMini ? '<button class="btn sm" data-a="mini" title="开一个始终置顶的小窗，工作时放在屏幕一角">悬浮小窗</button>' : '') + seg('day', ui.day, [[0, '今天'], [1, '明天']]) + '</div></div>';

    let tl = '<div class="load' + (over ? ' over' : '') + '"><i style="width:' + Math.min(100, Math.round(plan.planned / Math.max(1, plan.capacity + fixedMin) * 100)) + '%"></i></div>';
    let nowDone = !isToday;
    plan.blocks.forEach((b) => {
      if (!nowDone && b.s > nowMin) { tl += '<div class="nowline"><b>现在 ' + C.toHM(nowMin) + '</b></div>'; nowDone = true; }
      if (b.type === 'routine') {
        if (isToday && !b.actual && b.key !== 'sleep' && nowMin > b.s + 90) return;   // 过点很久又没打卡的，不再占地方（统计里记为未打卡）
        const target = S.routine.targets[b.key];

        tl += '<div class="tl routine"><div class="tl-t">' + target + '</div><div class="row"><div class="row-main"><div class="row-title">' + b.label + '</div></div><div class="row-side">' + st + '</div></div></div>';
      } else {

        tl += '<div class="tl ' + (b.type === 'fixed' ? 'fixed' : b.suggested ? 'sug' : '') + '"><div class="tl-t">' + C.toHM(b.s) + '<small>' + C.toHM(b.e) + '</small></div>' + row(it, { noDue: b.type === 'fixed' || it.due === date, noEst: true, part: b.part, suggested: b.suggested }) + '</div>';

    if (isToday) { const allTips = C.insights(S, now), tips = ui.moreTips ? allTips : allTips.slice(0, 2); if (tips.length) left += '<div class="tips">' + tips.map((t) => '<div class="tip ' + t.level + '"><span>' + esc(t.text) + '</span>' + (t.action ? '<button class="btn sm" data-a="tip" data-v="' + esc(t.action) + '">' + t.label + '</button>' : '') + '</div>').join('') + (allTips.length > 2 ? '<button class="btn ghost sm" style="align-self:flex-start" data-a="more-tips">' + (ui.moreTips ? '收起提示' : '还有 ' + (allTips.length - 2) + ' 条提示') + '</button>' : '') + '</div>'; }

  }

  /* ---------- 事项 ---------- */

  /* ---------- 抽屉 ---------- */

      }

    },
    'focus-start'(d) { const it = C.byId(S, d.id); if (!it) return; it.status = 'doing'; it.startedAt = Date.now(); touch(it); commit(); },
    'advice-accept'() { const a = S.advice; if (!a) return; const n = applyPending(a); a.dismissed = true; a.updatedAt = Date.now(); commit(); toast('已采纳 ' + n + ' 条建议'); },
    'advice-undo'() {

    },

    'adv-now'() { ui.syncBusy = true; render(); sync.syncNow({ advisor: true }).then(() => { ui.syncBusy = false; const c = sync.cfg(); ui.advMsg = c.advErr ? { ok: false, text: c.advErr } : { ok: true, text: '简报已上传；有新建议时会出现在“今天”页。' }; render(); }, (e) => { ui.syncBusy = false; ui.advMsg = { ok: false, text: e.message }; render(); }); },
    'phrase-del'(d) { const x = S.phrases.find((y) => y.id === d.id); if (x) { x.deleted = true; x.updatedAt = Date.now(); commit(); toast('已删除这个说法'); } },
    'rule-del'(d) { const r = S.rules.find((x) => x.id === d.id); if (r) { r.deleted = true; r.updatedAt = Date.now(); commit(); toast('规则已删除'); } },
    mini() { openMini(); },
    'sync-now'() { ui.syncBusy = true; ui.syncMsg = null; render(); sync.syncNow().then((last) => { const c = sync.cfg(), bad = c.remotes.filter((r) => !(last[r.id] || {}).ok); syncDone(bad.length ? { ok: false, text: '这次没有同步成功，改动仍保存在本机，稍后会自动重试。' } : { ok: true, text: '已同步。' }); }, (e) => syncDone({ ok: false, text: e.message })); },
    'sync-edit'() { const c = sync.cfg(), g = c.remotes.find((r) => r.type === 'github'); ui.sf = { ghRepo: g ? g.repo : '', ghToken: g ? g.token : '' }; ui.syncEdit = true; ui.syncMsg = null; render(); },

  };

  function onClick(e) {
    if (e.target.id === 'scrim') { A.close(); return; }
    const el = e.target.closest('[data-a]'); if (!el) return;
    const f = A[el.dataset.a]; if (f) { e.preventDefault(); f(el.dataset, el); }
  }
  document.addEventListener('click', onClick);
  document.addEventListener('toggle', (e) => { if (e.target.classList && e.target.classList.contains('more')) ui.sheetMore = e.target.open; }, true);
  document.addEventListener('input', (e) => { if (e.target.id === 'cap') capPreview(); else if (e.target.dataset && e.target.dataset.s) ui.sf[e.target.dataset.s] = e.target.value; });
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (e.key === 'Enter' && !e.isComposing) {
      if (t.id === 'cap') { e.preventDefault(); capAdd(); }
      else if (t.dataset && t.dataset.under) { e.preventDefault(); addSub(t.dataset.under); }
      else if (t.classList && t.classList.contains('sh-title')) t.blur();
    } else if (e.key === 'Escape') { if (ui.sheet) A.close(); else if (ui.addUnder) { ui.addUnder = null; render(); } }
    else if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(t.tagName)) { e.preventDefault(); $('#cap').focus(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target, d = t.dataset; if (!d) return;
    if (d.f) {
      const it = cur(); if (!it) return; const v = t.value;
      const fresh = it.raw && FIELD[d.f] && Date.now() - it.createdAt < 10 * 60000;
      if (fresh) noteParse(it.raw, d.f, d.f === 'due' ? it.due : it[d.f], v);
      if (d.f === 'title') { if (v.trim()) it.title = v.trim(); }
      else if (d.f === 'note') it.note = v;
      else if (d.f === 'projectId') { noteFix(it, v || null); it.projectId = v || null; const par = it.parentId && C.byId(S, it.parentId); if (par && (par.projectId || null) !== it.projectId) it.parentId = null; (function w(id) { C.childrenOf(S, id).forEach((c) => { c.projectId = it.projectId; touch(c); w(c.id); }); })(it.id); it.dependsOn = []; }
      else if (d.f === 'parentId') { it.parentId = v || null; const par = v && C.byId(S, v); if (par) it.projectId = par.projectId; }
      else if (d.f === 'due') { it.due = v || null; if (it.due) it.when = null; else it.by = false; }
      else if (d.f === 'until') { it.until = (v && it.due && v > it.due) ? v : null; if (it.until) { it.by = false; it.time = null; } }

      else if (d.f === 'today') it.planDate = t.checked ? todayStr() : null;
      else if (d.f === 'by') it.by = t.checked;
      else if (d.f === 'private') it.private = t.checked;
      else if (d.f === 'adddep') { if (v) it.dependsOn = (it.dependsOn || []).concat([v]); }
      if (fresh && (d.f === 'due' || d.f === 'time' || d.f === 'est')) C.learnFromCorrection(S, it);
      touch(it); const light = d.f === 'title' || d.f === 'note' || d.f === 'private' || d.f === 'today' || d.f === 'by' || d.f === 'where'; commit(light);
    } else if (d.p) {
      const p = curP(); if (!p) return;
      if (d.p === 'name') { if (t.value.trim()) p.name = t.value.trim().slice(0, 40); }

    } else if (d.c === 'restore') {

  /* ---------- 到点提示（页面开着时） ---------- */
  const fired = new Set();
  function tick() {
    runRollover();
    const now = new Date(), today = C.ymd(now), hm = C.nowHM(now), nm = now.getHours() * 60 + now.getMinutes(), msgs = [];
    live().forEach((i) => { if (i.status !== 'done' && i.due === today && i.time) { const dlt = C.toMin(i.time) - nm; if (dlt <= 10 && dlt >= 0 && !fired.has(today + i.id)) { fired.add(today + i.id); msgs.push((dlt ? dlt + ' 分钟后：' : '现在：') + i.title); } } });
    const T = S.routine.targets, log = S.routine.log[today] || {};
    [['breakfast', '该吃早饭了'], ['lunch', '该吃午饭了'], ['dinner', '该吃晚饭了']].forEach((m) => { if (T[m[0]] === hm && !log[m[0]] && !fired.has(today + m[0])) { fired.add(today + m[0]); msgs.push(m[1]); } });
    const wind = C.toHM(C.toMin(T.sleep) - S.settings.windDown);

    msgs.forEach((m) => { toast(m); if (S.settings.notify) { try { if (Notification.permission === 'granted') new Notification('有序', { body: m }); } catch (e) { } } });
    renderMini();
    if (ui.tab === 'today' && !ui.sheet && document.activeElement && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && now.getMinutes() % 5 === 0 && now.getSeconds() < 30) render();
  }

  /* ---------- 启动 ---------- */

  try { const h = (location.hash || '').replace('#', ''); if (VIEWS[h]) ui.tab = h; } catch (e) { }
  // 从别的应用“分享”过来的文字（比如微信里的一条消息），或长按图标选“随手记”：直接填进输入框
  let shared = '';
  try {
    const q = new URLSearchParams(location.search);
    if (q.has('text') || q.has('title') || q.has('url') || q.has('new')) {
      shared = [q.get('title'), q.get('text'), q.get('url')].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim().slice(0, 300);
      ui.focusCap = true; history.replaceState(null, '', location.pathname + location.hash);
    }
  } catch (e) { }
  window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (VIEWS[h] && h !== ui.tab) { ui.tab = h; render(); } });

  if (ui.focusCap) { const c0 = $('#cap'); c0.value = shared; capPreview(); c0.focus(); }

    window.addEventListener('online', () => queueSync(400));
  }
  if (!TRIAL) {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
    try {
      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
        navigator.serviceWorker.register('sw.js').catch(() => { });
        // 有新版本：没在输入、没开详情时直接换上；否则提示一下，由你点
        let pendingUpdate = false;
        const applyUpdate = () => { if (!typing() && !ui.sheet && !($('#cap').value || '').trim()) location.reload(); else if (!pendingUpdate) { pendingUpdate = true; toast('有新版本', '现在更新', () => location.reload()); } };
        navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'youxu-updated') applyUpdate(); });
      }
    } catch (e) { }
  }
  window.__youxu = { get state() { return S; }, ui: ui, sync: sync };
})();
